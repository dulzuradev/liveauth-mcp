<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveAuth Docs</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --electric-blue: #00C2FF;
      --btc-orange: #F2A900;
      --wall-deep: #0a0f1e;
      --wall-surface: #11182d;
      --wall-elevated: #1a2438;
      --text-primary: #e3e7ee;
      --text-secondary: #8b95a5;
      --border: rgba(0, 194, 255, 0.12);
      --sidebar-width: 260px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--wall-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Toolbar */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      min-height: 64px;
      backdrop-filter: blur(8px);
      background: rgba(10, 15, 30, 0.95);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      color: var(--electric-blue);
      text-decoration: none;
    }

    nav.toolbar-nav {
      display: flex;
      gap: 20px;
      margin-left: auto;
    }

    nav.toolbar-nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
      font-size: 14px;
    }

    nav.toolbar-nav a:hover { color: var(--electric-blue); }

    .sidebar-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 8px;
      margin-right: 8px;
    }
    .sidebar-toggle .material-icons { font-size: 24px; }

    /* Layout */
    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--wall-surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 0;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
    }

    .sidebar-section {
      padding: 0 12px;
      margin-bottom: 8px;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      padding: 8px 12px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      transition: all 0.15s;
      cursor: pointer;
    }

    .nav-item:hover {
      background: rgba(0, 194, 255, 0.06);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: rgba(0, 194, 255, 0.1);
      color: var(--electric-blue);
    }

    .nav-icon {
      font-size: 18px !important;
      opacity: 0.7;
    }

    .nav-item.active .nav-icon { opacity: 1; }

    /* Main content */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .doc-header {
      padding: 24px 40px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--wall-surface);
    }

    .doc-breadcrumb {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    #doc-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
    }

    #doc-content {
      flex: 1;
      padding: 40px;
      max-width: 860px;
    }

    /* Markdown styles */
    .markdown-body {
      color: var(--text-primary);
      line-height: 1.7;
      font-size: 15px;
    }

    .markdown-body h1 { font-size: 32px; margin-bottom: 24px; margin-top: 40px; }
    .markdown-body h1:first-child { margin-top: 0; }
    .markdown-body h2 { font-size: 22px; margin-bottom: 16px; margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--border); }
    .markdown-body h2:first-child { margin-top: 0; border-top: none; padding-top: 0; }
    .markdown-body h3 { font-size: 17px; margin-bottom: 12px; margin-top: 28px; color: var(--electric-blue); }
    .markdown-body h4 { font-size: 15px; margin-bottom: 8px; margin-top: 20px; }

    .markdown-body p { margin-bottom: 16px; color: var(--text-secondary); }
    .markdown-body p:last-child { margin-bottom: 0; }

    .markdown-body a { color: var(--electric-blue); text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }

    .markdown-body ul, .markdown-body ol {
      padding-left: 24px;
      margin-bottom: 16px;
      color: var(--text-secondary);
    }

    .markdown-body li { margin-bottom: 6px; }

    .markdown-body strong { color: var(--text-primary); font-weight: 600; }

    .markdown-body code {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 13px;
      background: var(--wall-elevated);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      color: #e3b87a;
    }

    .markdown-body pre {
      background: #0d1322;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 20px;
    }

    .markdown-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      color: #b0b8c8;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .markdown-body th {
      text-align: left;
      padding: 10px 14px;
      background: var(--wall-elevated);
      border: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-primary);
    }

    .markdown-body td {
      padding: 10px 14px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .markdown-body tr:hover td { background: rgba(0, 194, 255, 0.03); }

    .markdown-body blockquote {
      border-left: 3px solid var(--electric-blue);
      padding-left: 16px;
      margin: 0 0 16px;
      color: var(--text-secondary);
      font-style: italic;
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    /* Code block with copy button */
    .code-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 194, 255, 0.1);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      background: rgba(0, 194, 255, 0.2);
      color: var(--electric-blue);
    }

    .copy-btn .material-icons { font-size: 16px !important; }

    /* Error state */
    .error-state {
      text-align: center;
      padding: 80px 40px;
    }

    .error-state h3 { margin: 16px 0 8px; font-size: 20px; }
    .error-state p { color: var(--text-secondary); }
    .error-state a {
      display: inline-block;
      margin-top: 16px;
      color: var(--electric-blue);
    }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar { 
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 200;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 3px 0 12px rgba(0,0,0,0.4);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 150;
      }
      .sidebar-overlay.open { display: block; }
      #doc-content { padding: 24px 20px; }
      nav.toolbar-nav { display: none; }
      .sidebar-toggle { display: flex; align-items: center; }
    }
  </style>
</head>
<body>
  <!-- Toolbar -->
  <div class="toolbar">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation">
      <span class="material-icons">menu</span>
    </button>
    <a href="/" class="logo">
      <span class="material-icons" style="font-size:22px;">⚡</span>
      <span>LiveAuth</span>
    </a>
    <span style="color:var(--text-secondary);font-size:14px;margin-left:8px;">/ Docs</span>
    <nav class="toolbar-nav">
      <a href="https://liveauth.app">App</a>
      <a href="https://docs.liveauth.app/demo.html">Demo</a>
    </nav>
  </div>

  <div class="layout">
    <!-- Sidebar nav (built by doc-viewer.js) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-title">Getting Started</div>
      </div>
      <div id="doc-nav" class="sidebar-section" style="padding: 0 12px;">
        <!-- populated by doc-viewer.js -->
      </div>
    </aside>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Main -->
    <main class="main">
      <div class="doc-header">
        <div class="doc-breadcrumb">docs.liveauth.app / <span id="doc-breadcrumb">Loading...</span></div>
        <h1 id="doc-title">Loading...</h1>
      </div>
      <div id="doc-content">
        <p style="color:var(--text-secondary);">Loading document...</p>
      </div>
    </main>
  </div>

  <script src="doc-viewer.js"></script>
  <script>
    // Mobile sidebar toggle
    document.addEventListener('DOMContentLoaded', function() {
      var toggle = document.getElementById('sidebarToggle');
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('sidebarOverlay');
      if (!toggle || !sidebar) return;
      toggle.addEventListener('click', function() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
      });
      overlay.addEventListener('click', function() {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
      });
    });
  </script>
</body>
</html>
