<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveAuth Demo - Try PoW Verification</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      max-width: 600px;
      padding: 2rem;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #888; margin-bottom: 2rem; }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1rem;
    }
    .input-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; color: #aaa; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #00d4aa;
      color: #000;
    }
    .btn-primary:hover { background: #00f5c4; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      background: rgba(0,212,170,0.1);
      border: 1px solid #00d4aa;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      display: none;
    }
    .result.show { display: block; }
    .result.error {
      background: rgba(255,100,100,0.1);
      border-color: #ff6464;
    }
    .token {
      font-family: monospace;
      font-size: 0.8rem;
      word-break: break-all;
      background: rgba(0,0,0,0.3);
      padding: 0.5rem;
      border-radius: 4px;
      margin-top: 0.5rem;
    }
    .stats {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #888;
    }
    .stat { flex: 1; text-align: center; }
    .stat-value { font-size: 1.5rem; color: #00d4aa; }
    .progress {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 1rem;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #00d4aa;
      transition: width 0.1s;
    }
    .cta {
      text-align: center;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .cta a {
      color: #00d4aa;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 LiveAuth Demo</h1>
    <p class="subtitle">Try Proof-of-Work verification — no wallet needed</p>
    
    <div class="card">
      <div class="input-group">
        <label for="identifier">Your Identifier (any string)</label>
        <input type="text" id="identifier" placeholder="e.g., my-app, user-123, test" value="demo-user">
      </div>
      <button class="btn-primary" id="startBtn" onclick="startVerification()">Start Verification</button>
      
      <div class="progress" id="progress" style="display:none;">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
      </div>
      
      <div class="result" id="result"></div>
      
      <div class="stats" id="stats" style="display:none;">
        <div class="stat">
          <div class="stat-value" id="attempts">0</div>
          <div>Attempts</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="time">0ms</div>
          <div>Time</div>
        </div>
      </div>
    </div>
    
    <div class="cta">
      <p>Want to protect your API with real Lightning payments?</p>
      <p><a href="https://liveauth.app">Get your API keys →</a></p>
    </div>
  </div>

  <script>
    const API_URL = 'https://api.liveauth.app';
    let currentSession = null;
    let solving = false;

    async function startVerification() {
      const identifier = document.getElementById('identifier').value.trim();
      if (!identifier) return alert('Please enter an identifier');
      
      const btn = document.getElementById('startBtn');
      const result = document.getElementById('result');
      const progress = document.getElementById('progress');
      const progressBar = document.getElementById('progressBar');
      const stats = document.getElementById('stats');
      
      btn.disabled = true;
      btn.textContent = 'Getting challenge...';
      result.classList.remove('show', 'error');
      progress.style.display = 'block';
      progressBar.style.width = '10%';
      stats.style.display = 'none';
      
      try {
        // Step 1: Start auth session
        const startRes = await fetch(`${API_URL}/api/public/demo/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        
        if (!startRes.ok) throw new Error('Failed to start session');
        
        currentSession = await startRes.json();
        
        // Step 2: Solve PoW
        btn.textContent = 'Solving PoW challenge...';
        progressBar.style.width = '30%';
        
        const { solution, attempts, time } = await solvePoW(
          currentSession.challenge,
          currentSession.difficultyBits
        );
        
        progressBar.style.width = '70%';
        
        // Step 3: Verify
        btn.textContent = 'Verifying...';
        
        const verifyRes = await fetch(`${API_URL}/api/public/demo/confirm`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId: currentSession.sessionId,
            paymentHash: 'demo_no_payment_needed'
          })
        });
        
        progressBar.style.width = '100%';
        
        const verifyResult = await verifyRes.json();
        
        if (verifyResult.verified || verifyResult.token) {
          result.innerHTML = `
            <strong>✅ Verified!</strong>
            <p>Your token:</p>
            <div class="token">${verifyResult.token || 'demo-token-' + Date.now()}</div>
            <p style="margin-top:0.5rem;color:#888;font-size:0.9rem;">
              This proves you solved the PoW challenge. In production, this token would authorize API access.
            </p>
          `;
          result.classList.add('show');
        } else {
          // Demo mode - show what would happen
          result.innerHTML = `
            <strong>✅ PoW Solved!</strong>
            <p>You found a valid nonce in ${time}ms with ${attempts} attempts.</p>
            <p style="margin-top:0.5rem;color:#888;font-size:0.9rem;">
              In production, paying the Lightning invoice would complete verification and issue a token.
            </p>
          `;
          result.classList.add('show');
        }
        
        // Show stats
        document.getElementById('attempts').textContent = attempts;
        document.getElementById('time').textContent = time + 'ms';
        stats.style.display = 'flex';
        
      } catch (err) {
        result.innerHTML = `<strong>❌ Error:</strong> ${err.message}`;
        result.classList.add('show', 'error');
      }
      
      btn.disabled = false;
      btn.textContent = 'Try Again';
    }

    async function solvePoW(challenge, difficultyBits) {
      const startTime = Date.now();
      let attempts = 0;
      const targetZeros = Math.ceil(difficultyBits / 4);
      const target = '0'.repeat(targetZeros);
      
      while (true) {
        attempts++;
        if (attempts % 10000 === 0) {
          // Update progress UI
          await new Promise(r => setTimeout(r, 0));
        }
        
        const data = challenge + ':' + attempts;
        const hash = await sha256(data);
        
        if (hash.startsWith(target)) {
          return {
            solution: challenge + ':' + attempts,
            attempts,
            time: Date.now() - startTime
          };
        }
        
        // Safety limit
        if (attempts > 10000000) {
          throw new Error('Challenge too difficult');
        }
      }
    }

    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
  </script>
</body>
</html>
