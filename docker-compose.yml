services:

  # -------------------------
  # Reverse Proxy / TLS
  # -------------------------
  caddy:
    image: caddy:2.8
    container_name: liveauth-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./LiveAuthWeb/dist/liveauth-web:/srv
    depends_on:
      - liveauth-api
    networks:
      - liveauth

  # -------------------------
  # LiveAuth API (.NET)
  # -------------------------
  liveauth-api:
    image: liveauth-api:latest
    # Image is built locally and pushed to server via deploy.sh
    # To rebuild: run deploy.sh which builds locally and pushes
    container_name: liveauth-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/liveauth.db
      DB_PROVIDER: sqlite
      Admin__SkipPayment: "true"
      GitHub__ClientId: "Ov23li5BIPiYaNfLaBsn"
      GitHub__ClientSecret: "0ee4f29d2b7374442cffb739f455f8db0acc900e"
      Jwt__SigningKey: "swm3lIZ+arLWaU4Uz9zaUpzUbdV87O7p72Foo6RLtGstLmyeA3bNedhZenBn3H4t8n1IzsToxOVyaL1ILcFOtA=="
      Jwt__Issuer: "LiveAuth"
      Jwt__Audience: "LiveAuthUsers"
      LiveAuth__PowHmacSecret: "swm3lIZ+arLWaU4Uz9zaUpzUbdV87O7p72Foo6RLtGstLmyeA3bNedhZenBn3H4t8n1IzsToxOVyaL1ILcFOtA=="
      LiveAuth__DemoProjectId: "00000000-0000-0000-0000-000000000002"
      Lnd__BaseUrl: "https://172.17.0.1:8080"
      Lnd__Macaroon: "0201036c6e64024e030a106945c51d9c6384f95a6e806f29e808691201301a0f0a07616464726573731204726561641a0c0a04696e666f1204726561641a170a08696e766f696365731204726561641205777269746500000620c3811fa1751d53c71a722feae9517d0afc568532415d9fb39bec09dfbe8d1297"
    volumes:
      - sqlite_data:/data
    networks:
      - liveauth

networks:
  liveauth:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  sqlite_data:
