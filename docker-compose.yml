services:

  # -------------------------
  # Reverse Proxy / TLS
  # -------------------------
  caddy:
    image: caddy:2.8
    container_name: liveauth-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./LiveAuthWeb/dist:/srv
    depends_on:
      - liveauth-api
    networks:
      - liveauth

  # -------------------------
  # LiveAuth API
  # -------------------------
  liveauth-api:
    image: liveauth-api:latest
    container_name: liveauth-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__TrustForwardedHeaders: "true"
      ConnectionStrings__Default: ${LIVEAUTH_CONNECTION_STRING:-Data Source=/data/liveauth.db}
      DB_PROVIDER: sqlite
      Admin__SkipPayment: "false"
      GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-LiveAuth}
      Jwt__Audience: ${JWT_AUDIENCE:-LiveAuthUsers}
      LiveAuth__PowHmacSecret: ${LIVEAUTH_POW_HMAC_SECRET:?Set LIVEAUTH_POW_HMAC_SECRET}
      LiveAuth__DemoProjectId: ${LIVEAUTH_DEMO_PROJECT_ID:-00000000-0000-0000-0000-000000000002}
      CostShield__SigningPrivateKeyPemBase64: ${COSTSHIELD_SIGNING_PRIVATE_KEY_PEM_BASE64:?Set COSTSHIELD_SIGNING_PRIVATE_KEY_PEM_BASE64}
      CostShield__SigningKeyId: ${COSTSHIELD_SIGNING_KEY_ID:-costshield-rs256-v1}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromEmail: ${RESEND_FROM_EMAIL:-noreply@liveauth.app}
      Resend__FromName: ${RESEND_FROM_NAME:-LiveAuth}
      Lnd__BaseUrl: ${LND_BASE_URL:-https://172.17.0.1:8080}
      Lnd__Macaroon: ${LND_MACAROON:?Set LND_MACAROON}
      Lnd__UseMock: "false"
    volumes:
      - sqlite_data:/data
    networks:
      - liveauth

networks:
  liveauth:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  sqlite_data:
