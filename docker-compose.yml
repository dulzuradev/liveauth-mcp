services:

  # -------------------------
  # Reverse Proxy / TLS
  # -------------------------
  caddy:
    image: caddy:2.8
    container_name: liveauth-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./LiveAuthWeb/dist/liveauth-web:/srv
    depends_on:
      - liveauth-api
    networks:
      - liveauth

  # -------------------------
  # LiveAuth API (.NET)
  # -------------------------
  liveauth-api:
    image: liveauth-api:latest
    build:
      context: ./LiveAuthCore
      dockerfile: Dockerfile
    container_name: liveauth-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/liveauth.db
    volumes:
      - sqlite_data:/data
    networks:
      - liveauth

networks:
  liveauth:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  sqlite_data:
