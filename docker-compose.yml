version: "3.9"

networks:
  liveauth:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

services:

  # -------------------------
  # Reverse Proxy / TLS
  # -------------------------
  caddy:
    image: caddy:2.8
    container_name: liveauth-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./LiveAuthWeb/dist/liveauth-web/browser:/srv
    networks:
      - liveauth

  # -------------------------
  # LiveAuth API (.NET + SQLite)
  # -------------------------
  liveauth-api:
    build:
      context: ./LiveAuthCore
      dockerfile: Dockerfile
    container_name: liveauth-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/app/liveauth.db
    volumes:
      # 🔐 PERSISTENT SQLITE DATABASE
      - /opt/liveauth/data/liveauth.db:/app/liveauth.db
    networks:
      - liveauth
