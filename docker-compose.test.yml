# LiveAuth Test Environment
# Uses a separate database and test-only credentials on port 5001.

services:
  liveauth-test:
    image: liveauth-api:latest
    build:
      context: ./LiveAuthCore
      dockerfile: Dockerfile
    container_name: liveauth-test
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/liveauth-test.db
      DB_PROVIDER: sqlite
      Admin__SkipPayment: "true"
      LiveAuth__DemoProjectId: "00000000-0000-0000-0000-000000000002"
      LiveAuth__PowHmacSecret: "test-only-pow-hmac-secret-at-least-32-bytes"
      Jwt__SigningKey: "test-only-jwt-signing-key-at-least-32-bytes"
      Jwt__Issuer: LiveAuthTest
      Jwt__Audience: LiveAuthTestUsers
    volumes:
      - sqlite_test:/data

volumes:
  sqlite_test:
