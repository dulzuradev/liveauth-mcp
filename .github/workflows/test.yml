name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Clean
      run: |
        dotnet clean LiveAuthCore.Tests/LiveAuthCore.Tests.csproj
        dotnet clean LiveAuthCore/Services.Tests/LiveAuthCore.Services.Tests.csproj 2>/dev/null || true
        rm -rf LiveAuthCore.Tests/bin LiveAuthCore.Tests/obj
        rm -rf LiveAuthCore/Services.Tests/bin LiveAuthCore/Services.Tests/obj 2>/dev/null || true

    - name: Restore
      run: |
        dotnet restore LiveAuthCore.Tests/LiveAuthCore.Tests.csproj
        dotnet restore LiveAuthCore/Services.Tests/LiveAuthCore.Services.Tests.csproj 2>/dev/null || dotnet restore LiveAuthCore/LiveAuthCore.csproj

    - name: Build
      run: |
        dotnet build LiveAuthCore.Tests/LiveAuthCore.Tests.csproj
        dotnet build LiveAuthCore/LiveAuthCore.csproj

    - name: Run unit tests
      run: dotnet test LiveAuthCore.Tests/LiveAuthCore.Tests.csproj --verbosity normal

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Clean and restore
      run: |
        dotnet clean LiveAuthCore.IntegrationTests/LiveAuthCore.IntegrationTests.csproj
        dotnet restore LiveAuthCore.IntegrationTests/LiveAuthCore.IntegrationTests.csproj

    - name: Build integration tests
      run: dotnet build LiveAuthCore.IntegrationTests/LiveAuthCore.IntegrationTests.csproj --no-restore

    - name: Run integration tests
      run: dotnet test LiveAuthCore.IntegrationTests/LiveAuthCore.IntegrationTests.csproj --no-build --verbosity normal
      # Note: Integration tests may be skipped if they require LND/DB
