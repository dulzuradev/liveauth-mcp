name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore LiveAuthCore/LiveAuthCore.csproj

    - name: Build
      run: dotnet build LiveAuthCore/LiveAuthCore.csproj --no-restore

    - name: Run unit tests
      run: dotnet test LiveAuthCore/LiveAuthCore.csproj --no-build --verbosity normal

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore LiveAuthCore.IntegrationTests/LiveAuthCore.IntegrationTests.csproj

    - name: Build integration tests
      run: dotnet build LiveAuthCore.IntegrationTests/LiveAuthCore.IntegrationTests.csproj --no-restore

    - name: Run integration tests
      run: dotnet test LiveAuthCore.IntegrationTests/LiveAuthCore.IntegrationTests.csproj --no-build --verbosity normal
      # Note: Integration tests may be skipped if they require LND/DB
